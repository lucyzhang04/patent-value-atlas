name: Weekly data refresh

# Vercel rebuilds on every push via its Git integration. This job also triggers a
# rebuild every Monday so new upstream KPSS releases show up without a push.
# Needs a repository secret VERCEL_DEPLOY_HOOK (Vercel → Project → Settings → Git → Deploy Hooks).

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "VERCEL_DEPLOY_HOOK secret not set"; exit 1; fi
          curl -fsS -X POST "$HOOK"
